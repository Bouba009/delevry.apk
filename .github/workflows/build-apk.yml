          @Composable
          fun NewOrderDialog(
              repository: Repository,
              userLocation: GeoPoint,
              onDismiss: () -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val stores by repository.observeStores().collectAsState(initial = emptyList())

              var selectedStoreName by remember { mutableStateOf("") }
              var selectedStoreLat by remember { mutableStateOf(36.4686) }
              var selectedStoreLng by remember { mutableStateOf(2.6288) }
              var note by remember { mutableStateOf("") }
              var address by remember { mutableStateOf("العفرون") }
              var items by remember { mutableStateOf(listOf(OrderItem("وجبة 1", 1))) }

              val distance = repository.calculateDistanceKm(selectedStoreLat, selectedStoreLng, userLocation.latitude, userLocation.longitude)
              val price = repository.calculateDeliveryPrice(distance)

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("إنشاء طلب توصيل جديد", fontWeight = FontWeight.Black) },
                  text = {
                      Column(modifier = Modifier.fillMaxWidth()) {
                          Text("المتجر أو المطعم:", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          if (stores.isNotEmpty()) {
                              Row(modifier = Modifier.fillMaxWidth()) {
                                  stores.take(3).forEach { st ->
                                      FilterChip(
                                          selected = selectedStoreName == st.name,
                                          onClick = {
                                              selectedStoreName = st.name
                                              selectedStoreLat = st.lat
                                              selectedStoreLng = st.lng
                                          },
                                          label = { Text(st.name, fontSize = 10.sp) },
                                          modifier = Modifier.padding(2.dp)
                                      )
                                  }
                              }
                          }

                          Spacer(modifier = Modifier.height(8.dp))
                          OutlinedTextField(
                              value = address,
                              onValueChange = { address = it },
                              label = { Text("عنوان التوصيل بالتفصيل") },
                              modifier = Modifier.fillMaxWidth()
                          )

                          Spacer(modifier = Modifier.height(8.dp))
                          Text("قائمة الطلبات:", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          items.forEachIndexed { index, itm ->
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  OutlinedTextField(
                                      value = itm.name,
                                      onValueChange = { newName ->
                                          items = items.toMutableList().also { it[index] = itm.copy(name = newName) }
                                      },
                                      modifier = Modifier.weight(1f),
                                      label = { Text("اسم الوجبة") }
                                  )
                                  IconButton(onClick = {
                                      if (items.size > 1) {
                                          items = items.toMutableList().also { it.removeAt(index) }
                                      }
                                  }) {
                                      Icon(Icons.Default.Delete, contentDescription = null)
                                  }
                              }
                          }

                          TextButton(onClick = { items = items + OrderItem("", 1) }) {
                              Icon(Icons.Default.Add, contentDescription = null)
                              Text("إضافة وجبة أخرى", fontSize = 11.sp)
                          }

                          Spacer(modifier = Modifier.height(8.dp))
                          Text("سعر التوصيل المقدر: $price دج (المسافة: %.2f كم)".format(distance), fontWeight = FontWeight.Bold, color = PrimaryOrange)
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = {
                              if (selectedStoreName.isBlank() || address.isBlank()) {
                                  Toast.makeText(context, "يرجى تحديد المتجر والعنوان", Toast.LENGTH_SHORT).show()
                                  return@Button
                              }
                              scope.launch {
                                  val uid = repository.currentUid ?: ""
                                  val userDoc = repository.firestore.collection("users").document(uid).get().await()
                                  val uName = userDoc.getString("name") ?: "زبون"
                                  val uPhone = userDoc.getString("phoneNumber") ?: ""

                                  val orderData = hashMapOf(
                                      "restaurant" to selectedStoreName,
                                      "restaurantAddress" to "$selectedStoreLat,$selectedStoreLng",
                                      "storeLat" to selectedStoreLat,
                                      "storeLng" to selectedStoreLng,
                                      "customerAddress" to address,
                                      "price" to price,
                                      "items" to items.map { mapOf("name" to it.name, "qty" to it.qty) },
                                      "note" to note,
                                      "lat" to userLocation.latitude,
                                      "lng" to userLocation.longitude,
                                      "customerId" to uid,
                                      "customerName" to uName,
                                      "customerPhone" to uPhone,
                                      "status" to "pending",
                                      "createdAt" to SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).format(Date())
                                  )
                                  repository.firestore.collection("orders").add(orderData).await()
                                  onDismiss()
                              }
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = PrimaryOrange)
                      ) {
                          Text("إرسال الطلب")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("إلغاء") }
                  }
              )
          }

          @Composable
          fun ReportDialog(
              targetUid: String,
