          package com.elaffroun.delivery

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.elaffroun.delivery.data.AudioAlertManager
          import com.elaffroun.delivery.data.Repository
          import com.elaffroun.delivery.data.User
          import com.elaffroun.delivery.ui.components.*
          import com.elaffroun.delivery.ui.screens.*
          import com.elaffroun.delivery.ui.theme.*
          import org.osmdroid.config.Configuration

          class MainActivity : ComponentActivity() {

              private lateinit var audioAlertManager: AudioAlertManager
              private val repository = Repository()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  Configuration.getInstance().userAgentValue = BuildConfig.APPLICATION_ID
                  audioAlertManager = AudioAlertManager(this)

                  setContent {
                      val isDark = isSystemInDarkTheme()
                      val colors = if (isDark) {
                          darkColorScheme(
                              primary = PrimaryOrange,
                              background = DarkBackground,
                              surface = DarkSurface
                          )
                      } else {
                          lightColorScheme(
                              primary = PrimaryOrange,
                              background = LightBackground,
                              surface = LightSurface
                          )
                      }

                      MaterialTheme(colorScheme = colors) {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              MainNavigation(repository, audioAlertManager)
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  audioAlertManager.release()
              }
          }

          @Composable
          fun MainNavigation(repository: Repository, audioAlertManager: AudioAlertManager) {
              val navController = rememberNavController()
              var currentUserState by remember { mutableStateOf<User?>(null) }

              LaunchedEffect(repository.auth.currentUser) {
                  val uid = repository.auth.currentUser?.uid
                  if (uid != null) {
                      repository.observeCurrentUser(uid).collect { user ->
                          currentUserState = user
                          if (user != null) {
                              if (user.blocked) {
                                  navController.navigate("blocked") { popUpTo(0) }
                              } else if (user.role == "driver") {
                                  if (!user.approved) {
                                      navController.navigate("pending_approval") { popUpTo(0) }
                                  } else {
                                      navController.navigate("driver_dashboard") { popUpTo(0) }
                                  }
                              } else {
                                  navController.navigate("customer_dashboard") { popUpTo(0) }
                              }
                          }
                      }
                  } else {
                      navController.navigate("landing") { popUpTo(0) }
                  }
              }

              NavHost(navController = navController, startDestination = "landing") {
                  composable("landing") {
                      LandingScreen(
                          onLoginClick = { navController.navigate("auth/login") },
                          onRegisterClick = { navController.navigate("auth/register") },
                          onAdminPortalClick = { navController.navigate("admin_login") }
                      )
                  }
                  composable("auth/{mode}") { backStackEntry ->
                      val mode = backStackEntry.arguments?.getString("mode") ?: "login"
                      AuthScreen(
                          initialMode = mode,
                          repository = repository,
                          onAuthSuccess = { }
                      )
                  }
                  composable("customer_dashboard") {
                      CustomerScreen(
                          repository = repository,
                          audioAlertManager = audioAlertManager,
                          onLogout = {
                              repository.auth.signOut()
                              navController.navigate("landing") { popUpTo(0) }
                          }
                      )
                  }
                  composable("driver_dashboard") {
                      DriverScreen(
                          repository = repository,
                          audioAlertManager = audioAlertManager,
                          onLogout = {
                              repository.auth.signOut()
                              navController.navigate("landing") { popUpTo(0) }
                          }
                      )
                  }
                  composable("admin_login") {
                      AdminLoginScreen(
                          repository = repository,
                          onSuccess = { navController.navigate("admin_dashboard") { popUpTo("landing") } }
                      )
                  }
                  composable("admin_dashboard") {
                      AdminDashboardScreen(
                          repository = repository,
                          onExit = { navController.navigate("landing") { popUpTo(0) } }
                      )
                  }
                  composable("blocked") {
                      BlockedScreen(
                          reason = currentUserState?.blockedReason ?: "",
                          onLogout = {
                              repository.auth.signOut()
                              navController.navigate("landing") { popUpTo(0) }
                          }
                      )
                  }
                  composable("pending_approval") {
                      PendingApprovalScreen(
                          onLogout = {
                              repository.auth.signOut()
                              navController.navigate("landing") { popUpTo(0) }
                          }
                      )
                  }
              }
          }
          EOF

          echo "=== 6. Initializing Gradle Wrapper ==="
          gradle wrapper --gradle-version 8.6

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elaffroun-Delivery-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
