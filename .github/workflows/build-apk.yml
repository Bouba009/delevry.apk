          @Composable
          fun AuthScreen(
              initialMode: String,
              repository: Repository,
              onAuthSuccess: () -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var isLogin by remember { mutableStateOf(initialMode == "login") }
              var role by remember { mutableStateOf("customer") }

              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var passwordConfirm by remember { mutableStateOf("") }
              var termsCheck by remember { mutableStateOf(false) }
              var ageCheck by remember { mutableStateOf(false) }
              var isLoading by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp).verticalScroll(rememberScrollState()),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(
                      text = if (isLogin) "تسجيل الدخول" else if (role == "driver") "تسجيل عامل توصيل جديد" else "إنشاء حساب زبون",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Black,
                      color = MaterialTheme.colorScheme.onBackground
                  )
                  Spacer(modifier = Modifier.height(20.dp))

                  if (!isLogin) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                          FilterChip(selected = role == "customer", onClick = { role = "customer" }, label = { Text("زبون") })
                          Spacer(modifier = Modifier.width(8.dp))
                          FilterChip(selected = role == "driver", onClick = { role = "driver" }, label = { Text("عامل توصيل") })
                      }
                      Spacer(modifier = Modifier.height(12.dp))
                      OutlinedTextField(
                          value = name,
                          onValueChange = { name = it },
                          label = { Text("الاسم الكامل") },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(14.dp)
                      )
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(
                          value = phone,
                          onValueChange = { phone = it },
                          label = { Text("رقم الهاتف (إلزامي)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(14.dp)
                      )
                      Spacer(modifier = Modifier.height(8.dp))
                  }

                  OutlinedTextField(
                      value = email,
                      onValueChange = { email = it },
                      label = { Text("البريد الإلكتروني") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Email),
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(14.dp)
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = password,
                      onValueChange = { password = it },
                      label = { Text("كلمة المرور") },
                      visualTransformation = PasswordVisualTransformation(),
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(14.dp)
                  )

                  if (!isLogin) {
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(
                          value = passwordConfirm,
                          onValueChange = { passwordConfirm = it },
                          label = { Text("تأكيد كلمة المرور") },
                          visualTransformation = PasswordVisualTransformation(),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(14.dp)
                      )
                      Spacer(modifier = Modifier.height(12.dp))

                      if (role == "driver") {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = ageCheck, onCheckedChange = { ageCheck = it })
                              Text("أصرح بأن سني يتجاوز 18 سنة بالكامل", fontSize = 11.sp)
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = termsCheck, onCheckedChange = { termsCheck = it })
                              Text("أوافق على سياسة العمل الصارمة وعمولة المنصة", fontSize = 11.sp)
                          }
                      } else {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = termsCheck, onCheckedChange = { termsCheck = it })
                              Text("أوافق بالكامل على شروط الاستخدام وسياسة التوصيل", fontSize = 12.sp)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          if (email.isBlank() || password.isBlank()) {
                              Toast.makeText(context, "يرجى ملء جميع الحقول", Toast.LENGTH_SHORT).show()
                              return@Button
                          }
                          if (!isLogin) {
                              if (name.isBlank() || phone.isBlank()) {
                                  Toast.makeText(context, "الاسم ورقم الهاتف مطلوبان", Toast.LENGTH_SHORT).show()
                                  return@Button
                              }
                              if (password != passwordConfirm) {
                                  Toast.makeText(context, "كلمتا المرور غير متطابقتين", Toast.LENGTH_SHORT).show()
                                  return@Button
                              }
                              if (!termsCheck) {
                                  Toast.makeText(context, "يجب الموافقة على الشروط", Toast.LENGTH_SHORT).show()
                                  return@Button
                              }
                              if (role == "driver" && !ageCheck) {
                                  Toast.makeText(context, "يجب تأكيد السن القانوني (+18)", Toast.LENGTH_SHORT).show()
                                  return@Button
                              }
                          }

                          isLoading = true
                          scope.launch {
                              try {
                                  if (isLogin) {
                                      repository.auth.signInWithEmailAndPassword(email, password)
                                  } else {
                                      val res = repository.auth.createUserWithEmailAndPassword(email, password)
                                      val uid = res.user?.uid ?: ""
                                      val newUser = User(
                                          uid = uid,
                                          name = name,
                                          email = email,
                                          role = role,
                                          phoneNumber = phone,
                                          approved = (role != "driver"),
                                          createdAt = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).format(Date())
                                      )
                                      repository.firestore.collection("users").document(uid).set(newUser)
                                  }
                                  onAuthSuccess()
                              } catch (e: Exception) {
                                  Toast.makeText(context, "خطأ: ${e.localizedMessage}", Toast.LENGTH_LONG).show()
                              } finally {
                                  isLoading = false
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = PrimaryOrange),
                      shape = RoundedCornerShape(14.dp),
                      enabled = !isLoading
                  ) {
                      if (isLoading) {
                          CircularProgressIndicator(color = MaterialTheme.colorScheme.onPrimary, modifier = Modifier.size(24.dp))
                      } else {
                          Text(if (isLogin) "دخول" else "تسجيل الحساب", fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))
                  TextButton(onClick = { isLogin = !isLogin }) {
                      Text(
                          if (isLogin) "ليس لديك حساب؟ إنشاء حساب جديد" else "لديك حساب بالفعل؟ تسجيل دخول",
                          color = PrimaryOrange,
                          fontSize = 12.sp
                      )
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun CustomerScreen(
              repository: Repository,
              audioAlertManager: AudioAlertManager,
              onLogout: () -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val uid = repository.currentUid ?: ""

              var customerGeoPoint by remember { mutableStateOf(GeoPoint(36.4686, 2.6288)) }
              val activeOrder by repository.observeCustomerActiveOrders(uid).collectAsState(initial = null)
              val activeDrivers by repository.observeActiveDrivers().collectAsState(initial = emptyList())

              var showNewOrderModal by remember { mutableStateOf(false) }
              var showChatSheet by remember { mutableStateOf(false) }
              var showReportModal by remember { mutableStateOf(false) }

              val fusedLocationClient = remember { LocationServices.getFusedLocationProviderClient(context) }
              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { perms ->
                  if (perms[Manifest.permission.ACCESS_FINE_LOCATION] == true) {
                      fusedLocationClient.lastLocation.addOnSuccessListener { loc ->
                          if (loc != null) {
                              customerGeoPoint = GeoPoint(loc.latitude, loc.longitude)
                          }
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  permissionLauncher.launch(
                      arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  )
              }

              LaunchedEffect(activeOrder) {
                  val o = activeOrder
                  if (o != null && o.driverId.isNotBlank()) {
                      repository.firestore.collection("users").document(o.driverId)
                          .addSnapshotListener { snap, _ ->
                              val dLat = snap?.getDouble("lat")
                              val dLng = snap?.getDouble("lng")
                              if (dLat != null && dLng != null) {
                                  val dist = repository.calculateDistanceKm(dLat, dLng, o.lat, o.lng)
                                  if (dist <= 0.2) {
                                      audioAlertManager.playArrivalProximityAlert()
                                  }
                              }
                          }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("العفرون ديليفري", fontWeight = FontWeight.Black, fontSize = 16.sp) },
                          actions = {
                              IconButton(onClick = onLogout) {
                                  Icon(Icons.Default.ExitToApp, contentDescription = "خروج", tint = Color.Red)
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)
                      )
                  },
                  floatingActionButton = {
                      if (activeOrder == null) {
                          ExtendedFloatingActionButton(
                              onClick = { showNewOrderModal = true },
                              containerColor = PrimaryOrange,
                              contentColor = Color.White,
                              icon = { Icon(Icons.Default.AddShoppingCart, contentDescription = null) },
