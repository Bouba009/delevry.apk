          # AudioAlertManager.kt
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/data/AudioAlertManager.kt
          package com.elaffroun.delivery.data

          import android.content.Context
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import kotlinx.coroutines.*

          class AudioAlertManager(private val context: Context) {
              private var toneGenerator: ToneGenerator? = null
              private var ringtoneJob: Job? = null
              private val vibrator: Vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  val vibratorManager = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                  vibratorManager.defaultVibrator
              } else {
                  @Suppress("DEPRECATION")
                  context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
              }

              init {
                  try {
                      toneGenerator = ToneGenerator(AudioManager.STREAM_ALARM, 85)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun startDriverOrderRingtone(scope: CoroutineScope) {
                  stopDriverOrderRingtone()
                  ringtoneJob = scope.launch(Dispatchers.Default) {
                      while (isActive) {
                          toneGenerator?.startTone(ToneGenerator.TONE_CDMA_HIGH_L, 300)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator.vibrate(VibrationEffect.createOneShot(300, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator.vibrate(300)
                          }
                          delay(1200)
                      }
                  }
              }

              fun stopDriverOrderRingtone() {
                  ringtoneJob?.cancel()
                  ringtoneJob = null
                  toneGenerator?.stopTone()
              }

              fun playArrivalProximityAlert() {
                  toneGenerator?.startTone(ToneGenerator.TONE_PROP_BEEP2, 450)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 250, 150, 250), -1))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(450)
                  }
              }

              fun release() {
                  stopDriverOrderRingtone()
                  toneGenerator?.release()
                  toneGenerator = null
              }
          }
          EOF

          # Repository.kt
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/data/Repository.kt
          package com.elaffroun.delivery.data

          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.Query
          import kotlinx.coroutines.channels.awaitClose
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.callbackFlow
          import kotlinx.coroutines.tasks.await
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.*

          class Repository {
              val auth: FirebaseAuth = FirebaseAuth.getInstance()
              val firestore: FirebaseFirestore = FirebaseFirestore.getInstance()

              val currentUid: String? get() = auth.currentUser?.uid

              fun calculateDistanceKm(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val r = 6371.0
                  val dLat = Math.toRadians(lat2 - lat1)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val a = sin(dLat / 2).pow(2) +
                          cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) *
                          sin(dLon / 2).pow(2)
                  val c = 2 * atan2(sqrt(a), sqrt(1 - a))
                  return r * c
              }

              fun calculateDeliveryPrice(distanceKm: Double): Int {
                  val blocks = ceil(distanceKm / 0.5).toInt()
                  val fee = blocks * 50
                  return if (fee < 50) 50 else fee
              }

              fun observeCurrentUser(uid: String): Flow<User?> = callbackFlow {
                  val listener = firestore.collection("users").document(uid)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null) {
                              trySend(null)
                              return@addSnapshotListener
                          }
                          val user = snapshot?.toObject(User::class.java)
                          trySend(user)
                      }
                  awaitClose { listener.remove() }
              }

              fun observeStores(): Flow<List<Store>> = callbackFlow {
                  val listener = firestore.collection("stores")
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) {
                              trySend(emptyList())
                              return@addSnapshotListener
                          }
                          val stores = snapshot.documents.mapNotNull {
                              it.toObject(Store::class.java)?.apply { id = it.id }
                          }
                          trySend(stores)
                      }
                  awaitClose { listener.remove() }
              }

              fun observeActiveDrivers(): Flow<List<User>> = callbackFlow {
                  val listener = firestore.collection("users")
                      .whereEqualTo("role", "driver")
                      .whereEqualTo("approved", true)
                      .addSnapshotListener { snapshot, _ ->
                          val drivers = snapshot?.documents?.mapNotNull { it.toObject(User::class.java) } ?: emptyList()
                          trySend(drivers)
                      }
                  awaitClose { listener.remove() }
              }

              fun observeCustomerActiveOrders(customerId: String): Flow<Order?> = callbackFlow {
                  val listener = firestore.collection("orders")
                      .whereEqualTo("customerId", customerId)
                      .addSnapshotListener { snapshot, _ ->
                          val active = snapshot?.documents
                              ?.mapNotNull { it.toObject(Order::class.java)?.apply { id = it.id } }
                              ?.firstOrNull { it.status in listOf("pending", "accepted", "to_store", "received", "delivered") }
                          trySend(active)
                      }
                  awaitClose { listener.remove() }
              }

              fun observePendingOrders(): Flow<List<Order>> = callbackFlow {
                  val listener = firestore.collection("orders")
                      .whereEqualTo("status", "pending")
                      .addSnapshotListener { snapshot, _ ->
                          val list = snapshot?.documents?.mapNotNull { it.toObject(Order::class.java)?.apply { id = it.id } } ?: emptyList()
                          trySend(list)
                      }
                  awaitClose { listener.remove() }
              }

              fun observeDriverAssignedOrder(driverId: String): Flow<Order?> = callbackFlow {
                  val listener = firestore.collection("orders")
                      .whereEqualTo("driverId", driverId)
                      .addSnapshotListener { snapshot, _ ->
                          val current = snapshot?.documents
                              ?.mapNotNull { it.toObject(Order::class.java)?.apply { id = it.id } }
                              ?.firstOrNull { it.status in listOf("accepted", "to_store", "received") }
                          trySend(current)
                      }
                  awaitClose { listener.remove() }
              }

              fun observeChatMessages(orderId: String): Flow<List<ChatMessage>> = callbackFlow {
                  val listener = firestore.collection("orders").document(orderId)
                      .collection("messages")
                      .orderBy("sentAt", Query.Direction.ASCENDING)
                      .addSnapshotListener { snapshot, _ ->
                          val msgs = snapshot?.documents?.mapNotNull { it.toObject(ChatMessage::class.java)?.apply { id = it.id } } ?: emptyList()
                          trySend(msgs)
                      }
                  awaitClose { listener.remove() }
              }

              suspend fun sendMessage(orderId: String, text: String, senderRole: String) {
                  val msg = hashMapOf(
                      "sender" to senderRole,
                      "text" to text,
                      "sentAt" to SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).format(Date())
                  )
                  firestore.collection("orders").document(orderId).collection("messages").add(msg).await()
              }

              suspend fun updateDriverLocation(driverUid: String, lat: Double, lng: Double) {
                  firestore.collection("users").document(driverUid).update(
                      mapOf(
                          "lat" to lat,
                          "lng" to lng,
                          "lastUpdated" to SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).format(Date())
                      )
                  ).await()
              }

              suspend fun submitReport(reporterUid: String, targetUid: String, orderId: String, reason: String) {
                  val reportId = "${targetUid}_${reporterUid}"
                  val report = hashMapOf(
                      "reporterUid" to reporterUid,
                      "targetUid" to targetUid,
                      "orderId" to orderId,
                      "reason" to reason,
                      "createdAt" to SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).format(Date())
                  )
                  firestore.collection("reports").document(reportId).set(report).await()

                  val reportsSnap = firestore.collection("reports").whereEqualTo("targetUid", targetUid).get().await()
                  val uniqueReporters = reportsSnap.documents.mapNotNull { it.getString("reporterUid") }.toSet()
                  if (uniqueReporters.size >= 5) {
                      val cal = Calendar.getInstance()
                      cal.add(Calendar.DAY_OF_YEAR, 1)
                      val suspendDateStr = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).format(cal.time)

                      firestore.collection("users").document(targetUid).update(
                          mapOf(
                              "blocked" to true,
                              "blockedReason" to "community_standards",
                              "suspendedUntil" to suspendDateStr
                          )
                      ).await()
                  }
              }

              fun verifyAdminPassword(password: String): Boolean {
                  val bytes = password.toByteArray()
                  val md = MessageDigest.getInstance("SHA-256")
                  val digest = md.digest(bytes)
                  val hash = digest.fold("") { str, it -> str + "%02x".format(it) }
                  val b64 = android.util.Base64.encodeToString(bytes, android.util.Base64.NO_WRAP)
                  return hash == "74df6db14902c3eb4615a5f1ba8e26bc2a8315276137d3af803ba09c894d4d65" || b64 == "YWJvYm9iMTIz"
              }
          }
          EOF

          # OsmMapView.kt
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/ui/components/OsmMapView.kt
          package com.elaffroun.delivery.ui.components

          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.viewinterop.AndroidView
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Marker
          import org.osmdroid.views.overlay.Polyline

          @Composable
          fun OsmMapView(
              modifier: Modifier = Modifier,
              center: GeoPoint = GeoPoint(36.4686, 2.6288),
              zoom: Double = 14.5,
              markers: List<MapMarkerData> = emptyList(),
              routePoints: List<GeoPoint> = emptyList()
          ) {
              var mapViewInstance by remember { mutableStateOf<MapView?>(null) }

              AndroidView(
                  modifier = modifier,
                  factory = { ctx ->
                      MapView(ctx).apply {
                          setTileSource(TileSourceFactory.MAPNIK)
                          setMultiTouchControls(true)
                          controller.setZoom(zoom)
                          controller.setCenter(center)
                          mapViewInstance = this
                      }
                  },
                  update = { mapView ->
                      mapView.overlays.removeAll { it is Marker || it is Polyline }

                      if (routePoints.isNotEmpty()) {
                          val polyline = Polyline(mapView).apply {
                              setPoints(routePoints)
                              outlinePaint.color = android.graphics.Color.parseColor("#FF7E00")
                              outlinePaint.strokeWidth = 10f
                          }
                          mapView.overlays.add(polyline)
                      }

                      markers.forEach { data ->
                          val marker = Marker(mapView).apply {
                              position = data.point
                              title = data.title
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                          }
                          mapView.overlays.add(marker)
                      }
                      mapView.invalidate()
                  }
              )

              DisposableEffect(Unit) {
                  onDispose {
                      mapViewInstance?.onDetach()
                  }
              }
          }

          data class MapMarkerData(
              val point: GeoPoint,
              val title: String,
              val iconType: String = "customer"
          )
