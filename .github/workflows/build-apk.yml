          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DriverScreen(
              repository: Repository,
              audioAlertManager: AudioAlertManager,
              onLogout: () -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val uid = repository.currentUid ?: ""

              var driverGeoPoint by remember { mutableStateOf(GeoPoint(36.4686, 2.6288)) }
              val assignedOrder by repository.observeDriverAssignedOrder(uid).collectAsState(initial = null)
              val pendingOrders by repository.observePendingOrders().collectAsState(initial = emptyList())
              val currentUser by repository.observeCurrentUser(uid).collectAsState(initial = null)

              var showChatSheet by remember { mutableStateOf(false) }
              var showReportModal by remember { mutableStateOf(false) }

              val fusedLocationClient = remember { LocationServices.getFusedLocationProviderClient(context) }
              val permLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { perms ->
                  if (perms[Manifest.permission.ACCESS_FINE_LOCATION] == true) {
                      fusedLocationClient.lastLocation.addOnSuccessListener { loc ->
                          if (loc != null) {
                              driverGeoPoint = GeoPoint(loc.latitude, loc.longitude)
                              scope.launch {
                                  repository.updateDriverLocation(uid, loc.latitude, loc.longitude)
                              }
                          }
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  permLauncher.launch(
                      arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  )
              }

              LaunchedEffect(pendingOrders, assignedOrder) {
                  if (pendingOrders.isNotEmpty() && assignedOrder == null) {
                      audioAlertManager.startDriverOrderRingtone(this)
                  } else {
                      audioAlertManager.stopDriverOrderRingtone()
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("لوحة عامل التوصيل", fontWeight = FontWeight.Bold, fontSize = 16.sp) },
                          actions = {
                              IconButton(onClick = onLogout) {
                                  Icon(Icons.Default.ExitToApp, contentDescription = "خروج", tint = Color.Red)
                              }
                          }
                      )
                  }
              ) { padding ->
                  Box(modifier = Modifier.fillMaxSize().padding(padding)) {
                      OsmMapView(
                          modifier = Modifier.fillMaxSize(),
                          center = driverGeoPoint,
                          markers = listOf(MapMarkerData(driverGeoPoint, "موقعي", "driver"))
                      )

                      Card(
                          modifier = Modifier.fillMaxWidth().padding(12.dp).align(Alignment.TopCenter),
                          shape = RoundedCornerShape(16.dp),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              horizontalArrangement = Arrangement.SpaceAround
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("الدين الحالي", fontSize = 10.sp, color = Color.Gray)
                                  Text("${currentUser?.debt?.toInt() ?: 0} دج", fontWeight = FontWeight.Black, color = Color.Red)
                              }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("الحالة", fontSize = 10.sp, color = Color.Gray)
                                  Text(if (currentUser?.blocked == true) "مجمد" else "جاهز للعمل", fontWeight = FontWeight.Bold, color = Color(0xFF10B981))
                              }
                          }
                      }

                      if (pendingOrders.isNotEmpty() && assignedOrder == null) {
                          val incoming = pendingOrders.first()
                          Card(
                              modifier = Modifier.fillMaxWidth(0.92f).align(Alignment.Center).padding(16.dp),
                              shape = RoundedCornerShape(24.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                              elevation = CardDefaults.cardElevation(16.dp)
                          ) {
                              Column(modifier = Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("🔔 طلب توصيل جديد!", fontWeight = FontWeight.Black, fontSize = 18.sp, color = PrimaryOrange)
                                  Spacer(modifier = Modifier.height(10.dp))
                                  Text("المطعم: ${incoming.restaurant}", fontWeight = FontWeight.Bold)
                                  Text("عنوان الزبون: ${incoming.customerAddress}", fontSize = 12.sp, color = Color.Gray)
                                  Spacer(modifier = Modifier.height(6.dp))
                                  Text("قيمة التوصيل: ${incoming.price} دج", fontWeight = FontWeight.Black, fontSize = 16.sp, color = Color(0xFF10B981))
                                  Spacer(modifier = Modifier.height(16.dp))

                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Button(
                                          onClick = {
                                              audioAlertManager.stopDriverOrderRingtone()
                                              scope.launch {
                                                  repository.firestore.collection("orders").document(incoming.id).update(
                                                      mapOf(
                                                          "status" to "accepted",
                                                          "driverId" to uid,
                                                          "driverName" to (currentUser?.name ?: "عامل التوصيل"),
                                                          "driverPhone" to (currentUser?.phoneNumber ?: "")
                                                      )
                                                  )
                                              }
                                          },
                                          modifier = Modifier.weight(1f),
                                          colors = ButtonDefaults.buttonColors(containerColor = PrimaryOrange),
                                          shape = RoundedCornerShape(12.dp)
                                      ) {
                                          Text("قبول")
                                      }
                                  }
                              }
                          }
                      }

                      assignedOrder?.let { order ->
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(12.dp).align(Alignment.BottomCenter),
                              shape = RoundedCornerShape(20.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                              elevation = CardDefaults.cardElevation(10.dp)
                          ) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text("الطلب قيد التوصيل: ${order.restaurant}", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Button(
                                          onClick = {
                                              val intent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:${order.customerPhone}"))
                                              context.startActivity(intent)
                                          },
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2563EB)),
                                          shape = RoundedCornerShape(10.dp)
                                      ) {
                                          Icon(Icons.Default.Phone, contentDescription = null, modifier = Modifier.size(14.dp))
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Text("اتصل بالزبون", fontSize = 11.sp)
                                      }
                                  }

                                  Spacer(modifier = Modifier.height(12.dp))

                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Button(
                                          onClick = {
                                              scope.launch {
                                                  repository.firestore.collection("orders").document(order.id).update("status", "to_store")
                                              }
                                          },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(8.dp),
                                          colors = ButtonDefaults.buttonColors(containerColor = if (order.status == "to_store") PrimaryOrange else Color.DarkGray)
                                      ) {
                                          Text("في الطريق للمطعم", fontSize = 10.sp)
                                      }

                                      Button(
                                          onClick = {
                                              scope.launch {
                                                  repository.firestore.collection("orders").document(order.id).update("status", "received")
                                              }
                                          },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(8.dp),
                                          colors = ButtonDefaults.buttonColors(containerColor = if (order.status == "received") PrimaryOrange else Color.DarkGray)
                                      ) {
                                          Text("استلمت الطلب", fontSize = 10.sp)
                                      }

                                      Button(
                                          onClick = {
                                              scope.launch {
                                                  val dist = repository.calculateDistanceKm(order.storeLat, order.storeLng, order.lat, order.lng)
                                                  val addedDebt = dist * 10.0
                                                  val newTotalDebt = (currentUser?.debt ?: 0.0) + addedDebt

                                                  repository.firestore.collection("orders").document(order.id).update("status", "delivered")
                                                  repository.firestore.collection("users").document(uid).update(
                                                      mapOf(
                                                          "debt" to newTotalDebt,
                                                          "blocked" to (newTotalDebt >= 1000)
                                                      )
                                                  )
                                              }
                                          },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(8.dp),
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981))
                                      ) {
                                          Text("تم التسليم", fontSize = 10.sp)
                                      }
                                  }
                              }
                          }

                          Column(
                              modifier = Modifier.align(Alignment.CenterStart).padding(16.dp),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              FloatingActionButton(
                                  onClick = { showReportModal = true },
                                  containerColor = Color(0xFFDC2626),
                                  contentColor = Color.White,
                                  shape = CircleShape
                              ) {
                                  Icon(Icons.Default.Warning, contentDescription = "إبلاغ")
                              }

                              FloatingActionButton(
                                  onClick = { showChatSheet = true },
                                  containerColor = Color(0xFF2563EB),
                                  contentColor = Color.White,
                                  shape = CircleShape
                              ) {
                                  Icon(Icons.Default.Chat, contentDescription = "دردشة")
                              }
                          }
                      }
                  }
              }

              if (showChatSheet && assignedOrder != null) {
                  ChatBottomSheet(
                      orderId = assignedOrder!!.id,
                      userRole = "driver",
                      repository = repository,
                      onDismiss = { showChatSheet = false }
                  )
              }

              if (showReportModal && assignedOrder != null) {
                  ReportDialog(
                      targetUid = assignedOrder!!.customerId,
                      orderId = assignedOrder!!.id,
                      repository = repository,
                      onDismiss = { showReportModal = false }
                  )
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ChatBottomSheet(
              orderId: String,
              userRole: String,
              repository: Repository,
              onDismiss: () -> Unit
          ) {
              val messages by repository.observeChatMessages(orderId).collectAsState(initial = emptyList())
              var inputText by remember { mutableStateOf("") }
              val scope = rememberCoroutineScope()

              ModalBottomSheet(onDismissRequest = onDismiss) {
                  Column(
                      modifier = Modifier.fillMaxWidth().height(420.dp).padding(16.dp)
                  ) {
                      Text("محادثة الطلب المباشرة", style = MaterialTheme.typography.titleMedium)
                      Spacer(modifier = Modifier.height(8.dp))

                      LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                          items(messages) { msg ->
                              val isMe = msg.sender == userRole
                              Box(
                                  modifier = Modifier.fillMaxWidth(),
                                  contentAlignment = if (isMe) Alignment.CenterEnd else Alignment.CenterStart
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .padding(vertical = 4.dp)
                                          .background(if (isMe) PrimaryOrange else Color.Gray.copy(alpha = 0.3f), shape = RoundedCornerShape(12.dp))
                                          .padding(horizontal = 12.dp, vertical = 8.dp)
                                  ) {
                                      Text(text = msg.text, color = if (isMe) Color.White else MaterialTheme.colorScheme.onSurface, fontSize = 13.sp)
                                  }
                              }
                          }
                      }

                      Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(
                              value = inputText,
                              onValueChange = { inputText = it },
                              modifier = Modifier.weight(1f),
                              placeholder = { Text("اكتب رسالة...") },
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.width(8.dp))
                          IconButton(
                              onClick = {
                                  if (inputText.isNotBlank()) {
                                      val txt = inputText
                                      inputText = ""
                                      scope.launch { repository.sendMessage(orderId, txt, userRole) }
                                  }
                              }
                          ) {
                              Icon(Icons.Default.Send, contentDescription = "Send", tint = PrimaryOrange)
                          }
                      }
                  }
              }
          }

