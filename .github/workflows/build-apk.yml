          @Composable
          fun AdminDashboardScreen(
              repository: Repository,
              onExit: () -> Unit
          ) {
              val scope = rememberCoroutineScope()
              var drivers by remember { mutableStateOf<List<User>>(emptyList()) }

              LaunchedEffect(Unit) {
                  repository.firestore.collection("users")
                      .whereEqualTo("role", "driver")
                      .addSnapshotListener { snap, _ ->
                          drivers = snap?.documents?.mapNotNull { it.toObject(User::class.java) } ?: emptyList()
                      }
              }

              Scaffold(
                  topBar = {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("لوحة رقابة الإدارة", fontWeight = FontWeight.Black, fontSize = 18.sp)
                          Button(onClick = onExit) { Text("خروج") }
                      }
                  }
              ) { padding ->
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(padding).padding(16.dp)) {
                      item {
                          Text("طلبات توظيف ومراجعة ديون عمال التوصيل", fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(12.dp))
                      }
                      items(drivers) { driver ->
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp),
                              shape = RoundedCornerShape(14.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text(driver.name, fontWeight = FontWeight.Bold)
                                      Text(driver.phoneNumber, fontSize = 11.sp, color = Color.Gray)
                                      Text("الدين: ${driver.debt.toInt()} دج", color = Color.Red, fontSize = 11.sp)
                                  }

                                  Row {
                                      if (!driver.approved) {
                                          Button(
                                              onClick = {
                                                  scope.launch {
                                                      repository.firestore.collection("users").document(driver.uid).update("approved", true)
                                                  }
                                              },
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981))
                                          ) {
                                              Text("تفعيل وقبول", fontSize = 10.sp)
                                          }
                                      } else {
                                          Button(
                                              onClick = {
                                                  scope.launch {
                                                      repository.firestore.collection("users").document(driver.uid).update(
                                                          mapOf("debt" to 0.0, "blocked" to false)
                                                      )
                                                  }
                                              }
                                          ) {
                                              Text("تصفير الدين", fontSize = 10.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
